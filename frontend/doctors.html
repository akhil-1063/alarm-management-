<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctors — ICU Sentinel</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<div class="layout">
  <div class="main" id="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation"><i data-lucide="menu"></i></button>
      <h1 id="topbar-title">Doctors</h1>
      <div class="spacer"></div>
      <button class="btn secondary sm" id="icu-theme" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
    </header>

    <div class="content">
      <div class="card mb">
        <div class="card-head"><h2><i data-lucide="user-check"></i> Pending doctor approvals</h2></div>
        <div id="pending-root"><div class="spinner"></div></div>
      </div>

      <div class="card mb">
        <div class="card-head"><h2><i data-lucide="stethoscope"></i> All doctors</h2></div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Status</th><th>Last login</th><th></th></tr></thead>
            <tbody id="doctors-tbody"><tr><td colspan="6" class="center muted"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2><i data-lucide="git-compare-arrows"></i> Doctor–patient assignments</h2></div>
        <form id="assign-form" class="row mb" style="align-items:flex-end;">
          <label class="field" style="min-width:210px;">Doctor
            <select id="as-doc"></select></label>
          <label class="field" style="min-width:210px;">Patient
            <select id="as-pat"></select></label>
          <button class="btn" type="submit"><i data-lucide="link"></i> Assign</button>
        </form>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>ID</th><th>Doctor</th><th>Patient</th><th>Since</th><th>Status</th><th></th></tr></thead>
            <tbody id="assign-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/vendor/lucide.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/app.js"></script>
<script>
"use strict";
let DOCTORS = [], PATIENTS = [];

async function loadPending() {
  const data = await ICU.get("/admin/pending-doctors");
  const el = document.getElementById("pending-root");
  if (!data.doctors.length) {
    el.innerHTML = `<div class="state-box" style="padding:1rem;"><div>No accounts pending approval</div></div>`;
    return;
  }
  el.innerHTML = `<div class="table-wrap"><table class="data">
    <thead><tr><th>Name</th><th>Email</th><th>Specialty</th><th>Requested</th><th></th></tr></thead>
    <tbody>${data.doctors.map((d) => `<tr>
      <td><strong>${ICU.esc(d.full_name)}</strong></td>
      <td>${ICU.esc(d.email)}</td>
      <td>${ICU.esc(d.specialty || "—")}</td>
      <td class="dim">${ICU.fmtTime(d.created_at)}</td>
      <td class="row tight">
        <button class="btn sm" data-approve="${d.id}"><i data-lucide="check"></i> Approve</button>
        <button class="btn sm ghost-danger" data-reject="${d.id}"><i data-lucide="x"></i> Reject</button>
      </td>
    </tr>`).join("")}</tbody></table></div>`;
  el.querySelectorAll("[data-approve]").forEach((b) => b.addEventListener("click", async () => {
    await ICU.post(`/admin/doctors/${b.dataset.approve}/approve`);
    ICU.toast("Doctor approved", "success");
    await refresh();
  }));
  el.querySelectorAll("[data-reject]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("Reject/deactivate this doctor account?")) return;
    await ICU.post(`/admin/doctors/${b.dataset.reject}/reject`);
    ICU.toast("Doctor rejected", "warn");
    await refresh();
  }));
  ICU.icons();
}

async function loadDoctors() {
  const data = await ICU.get("/admin/users", { role: "doctor" });
  DOCTORS = data.users || [];
  const tbody = document.getElementById("doctors-tbody");
  tbody.innerHTML = DOCTORS.map((d) => `<tr>
    <td class="mono">#${d.id}</td>
    <td><strong>${ICU.esc(d.full_name)}</strong></td>
    <td>${ICU.esc(d.email)}</td>
    <td>${d.is_active
      ? (d.is_approved ? `<span class="badge ok">approved</span>` : `<span class="badge moderate">pending</span>`)
      : `<span class="badge critical">inactive</span>`}</td>
    <td class="dim">${ICU.fmtTime(d.last_login_at)}</td>
    <td>${!d.is_approved && d.is_active
      ? `<button class="btn sm secondary" data-appr="${d.id}"><i data-lucide="check"></i> Approve</button>` : ""}</td>
  </tr>`).join("") || `<tr><td colspan="6" class="center muted">No doctor accounts</td></tr>`;
  tbody.querySelectorAll("[data-appr]").forEach((b) => b.addEventListener("click", async () => {
    await ICU.post(`/admin/doctors/${b.dataset.appr}/approve`);
    ICU.toast("Approved", "success");
    await refresh();
  }));

  document.getElementById("as-doc").innerHTML = DOCTORS.filter((d) => d.is_approved && d.is_active)
    .map((d) => `<option value="${d.id}">${ICU.esc(d.full_name)}</option>`).join("")
    || `<option value="">(no approved doctors)</option>`;
  ICU.icons();
}

async function loadPatients() {
  const data = await ICU.get("/patients");
  PATIENTS = data || [];
  document.getElementById("as-pat").innerHTML = PATIENTS
    .map((p) => `<option value="${p.user_id}">${ICU.esc(p.full_name)} (#${p.user_id})</option>`).join("")
    || `<option value="">(no patients)</option>`;
}

async function loadAssignments() {
  const data = await ICU.get("/doctors/assignments");
  const tbody = document.getElementById("assign-tbody");
  tbody.innerHTML = (data.assignments || []).map((a) => `<tr>
    <td class="mono">#${a.id}</td>
    <td>${ICU.esc(a.doctor_name || "#" + a.doctor_user_id)}</td>
    <td><a href="/patient_monitor.html?id=${a.patient_user_id}">${ICU.esc(a.patient_name || "#" + a.patient_user_id)}</a></td>
    <td class="dim">${ICU.fmtTime(a.created_at)}</td>
    <td>${a.is_active ? `<span class="badge ok">active</span>` : `<span class="badge neutral">removed</span>`}</td>
    <td>${a.is_active ? `<button class="btn sm ghost-danger" data-un="${a.id}"><i data-lucide="unlink"></i> Remove</button>` : ""}</td>
  </tr>`).join("") || `<tr><td colspan="6" class="center muted">No assignments yet</td></tr>`;
  tbody.querySelectorAll("[data-un]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("Remove this assignment? The doctor immediately loses access to this patient.")) return;
    await ICU.del(`/doctors/assignments/${b.dataset.un}`);
    ICU.toast("Assignment removed", "success");
    await loadAssignments();
  }));
  ICU.icons();
}

async function refresh() {
  await Promise.all([loadPending(), loadDoctors(), loadPatients(), loadAssignments()]);
}

(async function boot() {
  const me = await ICUShell.init({ title: "Doctors", active: "/doctors.html", roles: ["admin"] });
  if (!me) return;
  document.getElementById("assign-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const doctor = document.getElementById("as-doc").value;
    const patient = document.getElementById("as-pat").value;
    if (!doctor || !patient) { ICU.toast("Select a doctor and a patient", "warn"); return; }
    try {
      await ICU.post("/doctors/assignments", {
        doctor_user_id: parseInt(doctor, 10), patient_user_id: parseInt(patient, 10),
      });
      ICU.toast("Patient assigned to doctor", "success");
      await loadAssignments();
    } catch (err) { ICU.toast(err.message, "error"); }
  });
  await refresh();
})();
</script>
</body>
</html>
